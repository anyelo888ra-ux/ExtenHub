name: Admin approval and publish

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  publish:
    if: github.event.issue.pull_request && github.event.comment.body == '/verify' && github.actor == 'anyelo888ra-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate PR submission, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-submission.js
      - name: Commit published catalog
        run: |
          git config user.name "ExtenHub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.json extensions
          if git diff --cached --quiet; then echo "No catalog changes"; exit 0; fi
          git commit -m "Publish verified extension from PR #${{ github.event.issue.number }}"
          git push origin HEAD:main
      - name: Confirm publication and close submission PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api repos/$REPOSITORY/issues/$PR_NUMBER/comments -f body="✅ **ExtenHub: publicación aprobada.** La extensión fue añadida al catálogo y recibió un ID único. Su estado es verified. Esto indica revisión del equipo ExtenHub, no certificación oficial del navegador."
          gh api repos/$REPOSITORY/issues/$PR_NUMBER -X PATCH -f state=closed